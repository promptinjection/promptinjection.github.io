name: Prompt Injection
title: Prompt Injection
subtitle: security research database for prompt injection techniques

# Site URL configuration for GitHub Pages
# For a user/org site (promptinjection.github.io), baseurl must be empty
url: "https://promptinjection.github.io"
baseurl: ""

# GitHub repository (required for jekyll-github-metadata plugin)
repository: promptinjection/promptinjection.github.io

# Build settings
markdown: kramdown
theme: null
future: true
show_excerpts: true

plugins:
  - jekyll-seo-tag

# Permalink structure for blog posts
permalink: /:year/:month/:day/:title:output_ext

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
