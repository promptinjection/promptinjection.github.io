name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          cache-version: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --future --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Optimize & Verify Static Build
        run: |
          echo "Syncing custom layouts and matrix data..."
          python3 scripts/build_site.py

          echo "Purging raw heavy CSVs from _site to enforce Pages limits..."
          rm -f _site/*.csv
          rm -f _site/*.bak*

          echo "Validating essential deployment artifacts..."
          test -s _site/index.html || { echo "::error::Missing or empty index.html"; exit 1; }
          test -s _site/style.css || { echo "::error::Missing or empty style.css"; exit 1; }
          test -s _site/script.js || { echo "::error::Missing or empty script.js"; exit 1; }
          test -s _site/data/manifest.json || { echo "::error::Missing or empty data/manifest.json"; exit 1; }
          test -s _site/data/ai-kill-chain.json || { echo "::error::Missing or empty data/ai-kill-chain.json"; exit 1; }

          echo "Build verification passed. Total files in _site:"
          find _site -type f | wc -l

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
