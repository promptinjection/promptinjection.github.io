name: CSV Linter and Trailing Whitespaces

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint_and_check_trailing_whitespaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install csvkit

      - name: Validate CSV structure
        run: |
          echo "Checking CSV structure..."
          if ! csvclean -n prompt-injection.csv 2>&1 | tee /tmp/csv_errors.log; then
            echo "::error::CSV validation failed"
            cat /tmp/csv_errors.log
            exit 1
          fi

      - name: Check CSV format
        run: |
          echo "Checking CSV structure only..."
          if ! python -c '
          import csv
          with open("prompt-injection.csv", "r", encoding="utf-8") as f:
              reader = csv.reader(f)
              headers = next(reader)
              print(f"CSV headers: {headers}")
              row_count = sum(1 for _ in reader)
              print(f"Total rows: {row_count}")
          '; then
            echo "::error::CSV format check failed"
            exit 1
          fi

      - name: Check Trailing Whitespaces
        run: |
          echo "Checking for trailing whitespaces..."
          if grep -q "[[:space:]]$" prompt-injection.csv; then
            echo "::warning::Found trailing whitespaces in prompt-injection.csv"
            grep -n "[[:space:]]$" prompt-injection.csv | head -5
          fi
          echo "Trailing whitespace check completed"

      - name: Check for UTF-8 BOM and line endings
        run: |
          echo "Checking for UTF-8 BOM and line endings..."
          if file prompt-injection.csv | grep -q "with BOM"; then
            echo "::error::File contains UTF-8 BOM marker"
            exit 1
          fi
          if file prompt-injection.csv | grep -q "CRLF"; then
            echo "::error::File contains Windows-style (CRLF) line endings"
            exit 1
          fi
          echo "File encoding check passed"
