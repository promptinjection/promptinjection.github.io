steps:
  - name: Checkout repository
    uses: actions/checkout@v3
    with:
      fetch-depth: 0

  - name: Set up Ruby
    uses: ruby/setup-ruby@v1
    with:
      ruby-version: "3.2"
      bundler-cache: false

  - name: Update RubyGems to 3.7.2
    run: gem update --system 3.7.2

  - name: Install Bundler matching Gemfile.lock
    run: gem install bundler -v "2.6.2"

  - name: Disable Bundler frozen mode (allow CI to update lockfile if necessary)
    run: bundle config set --local frozen false

  - name: Configure Bundler path
    run: bundle config set --local path vendor/bundle

  - name: Install dependencies
    run: bundle install --jobs 4 --retry 3

  - name: Build site
    run: bundle exec jekyll build --destination ./_site

  - name: Deploy to GitHub Pages
    uses: peaceiris/actions-gh-pages@v3
    with:
      github_token: ${{ secrets.GITHUB_TOKEN }}
      publish_dir: ./_site
